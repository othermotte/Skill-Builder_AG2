steps:
  # Deploy Firebase Cloud Functions first. These hold the Gemini API key and
  # mint ephemeral Live tokens for authenticated users.
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd functions
        npm ci
        npm run build
        npx firebase-tools@latest deploy --only functions --project="leadership-skill-builder-7aba5" --non-interactive --force

  # Build the container image (no API key needed — it's now in Cloud Functions)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skill-builder/skill-builder:$BUILD_ID'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/skill-builder/skill-builder:$BUILD_ID']

  # Deploy container image to Cloud Run (Production service)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'skill-builder-ag'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skill-builder/skill-builder:$BUILD_ID'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skill-builder/skill-builder:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
