steps:
  # Build the container image (no API key needed — it's now in Cloud Functions)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/skill-builder-ag-dev'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/skill-builder-ag-dev']

  # Deploy container image to Cloud Run (dev service — separate from production)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'skill-builder-ag-dev'
      - '--image'
      - 'gcr.io/$PROJECT_ID/skill-builder-ag-dev'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/skill-builder-ag-dev'

options:
  logging: CLOUD_LOGGING_ONLY
